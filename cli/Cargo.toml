[package]
name = "wispdisk-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
build = "build.rs"

[[bin]]
name = "wispdisk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# Preserve the package's Rust 1.85 minimum; newer time releases require 1.88.
time = { version = "=0.3.44", features = ["formatting", "parsing"] }

serde = { workspace = true }
wmi = { workspace = true }
ferrisetw = "1.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_IscsiDisc",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
] }

[build-dependencies]
winresource = "0.1.31"
